name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"

jobs:
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint commit messages
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  check:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run generate
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:consumers

  # v0, v1, the bench, and gen's unit and go projects, then the consumers and e2e. Gen's rust and python projects
  # run beside it in gen-rust and gen-python, and gen-coverage holds the three shards' merged coverage to gen's
  # thresholds (contract 28 §8.3). CI calls the root `test` script's parts, each run whatever an earlier one did,
  # as its `;` does; the script itself stays the local run of all of them.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # the integration suites run server fixtures as `node x.ts`: they need Node's type stripping,
      # which the runner image's default Node may not have
      - uses: actions/setup-node@v4
        with:
          node-version: current
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # gen compiles and runs the emitted Go SDK at the toolchain .go-version pins (GOTOOLCHAIN through
      # its go-env fixture), with the module cache and the pinned toolchain under ~/.cache/honey-tmp/go
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      # the pinned and floor toolchains and the WebSocket module: a change in any saves a new cache
      - uses: actions/cache@v4
        with:
          path: ~/.cache/honey-tmp/go/mod
          key: ${{ runner.os }}-gomod-test-${{ hashFiles('.go-version', 'packages/gen/src/emit/go/__fixtures__/go-env.ts', 'packages/gen/src/emit/go/sdk.ts') }}
          restore-keys: ${{ runner.os }}-gomod-test-
      # the Go build cache and the compiled SDKs (go/__fixtures__/compiled.ts), each SDK dir named by the hash
      # of what it holds. The key hashes every input of what gets compiled (toolchain-projects.test.ts holds
      # it to that), so a commit that changes none restores every SDK and compiles nothing; a changed input
      # restores the last set and rebuilds only the SDKs whose content changed. It is apart from the module
      # cache above (no shared path), which changes only with the toolchains and the dependency set. This job
      # saves both; gen-rust only restores them.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/honey-tmp/go/cache
            ~/.cache/honey-tmp/go/sdk
          key: >-
            ${{ runner.os }}-gobuild-${{ hashFiles('.go-version', 'packages/gen/src/emit/go/**',
            'packages/gen/src/emit/shared/**', 'packages/gen/src/ir/**', 'packages/gen/src/runtime/go/**',
            'packages/gen/tests/security/**', 'packages/gen/tests/structure/mutation-harness*.ts',
            'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/matrix.ts') }}
          restore-keys: ${{ runner.os }}-gobuild-
      - run: touch "$RUNNER_TEMP/go-sdk-start"
      - run: bun install --frozen-lockfile
      - run: bun run generate
      # frozen v0 tests listen on fixed ports inside the ephemeral range: reserve them so no automatically
      # assigned port (a client socket, a port-0 server another test left) holds one
      - run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=45910-45912,45986
      # diagnostic, an open issue: v0's target-artifacts suite failed with EADDRINUSE on its reserved 45912 at
      # ee8c46e and a386de5, so a process binds it explicitly; record every socket on 45910-45912 with its
      # process until the job ends, and print them if the job fails
      - name: Watch the v0 fixed ports
        run: |
          sudo nohup bash -c 'while :; do
            ss -tanpH "( sport >= :45910 and sport <= :45912 )" | while read -r line; do
              echo "$(date +%T.%N | cut -c1-12) $line"
              for pid in $(grep -o "pid=[0-9]*" <<< "$line" | cut -d= -f2 | sort -u); do
                echo "  $(ps -o pid=,ppid=,args= -p "$pid" | cut -c1-300)"
              done
            done
            sleep 0.05
          done' > "$RUNNER_TEMP/v0-ports.txt" 2>&1 &
      - run: bun run test:v0
      - if: ${{ !cancelled() }}
        run: bun run test:v1
      # gen's shard: thresholds off here, since a shard covers only what its projects run; gen-coverage holds the
      # merge to them. The blob carries the results and the coverage, and the default reporter prints the run.
      - name: gen (unit and go)
        if: ${{ !cancelled() }}
        working-directory: packages/gen
        run: >-
          bunx vitest run --project unit --project go --coverage --coverage.thresholds.lines=0
          --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0
          --reporter=default --reporter=blob --outputFile.blob="$RUNNER_TEMP/gen-blob/test.json"
        env:
          # a missing toolchain fails the run instead of skipping its tests
          HONEY_REQUIRE_TOOLCHAINS: "1"
      - if: ${{ !cancelled() }}
        run: bun run test:bench
      - name: The sockets on the v0 fixed ports
        if: failure()
        run: |
          grep -v -e "^  " -e TIME-WAIT "$RUNNER_TEMP/v0-ports.txt" | sort -u -k2 | head -300
          grep "^  " "$RUNNER_TEMP/v0-ports.txt" | sort -u | head -100
          echo "--- the timeline, TIME-WAIT left out"
          grep -v TIME-WAIT "$RUNNER_TEMP/v0-ports.txt" | head -1500
      # every SDK dir this run built or reused has a .complete newer than the start; the rest are stale
      # (their inputs changed), so the saved cache stays one run's SDKs instead of growing with each change.
      # Only the go project compiles SDKs, so the other shards use none of them.
      - name: Prune the Go SDKs this run did not use
        run: >-
          find ~/.cache/honey-tmp/go/sdk -mindepth 2 -maxdepth 2 -name .complete
          ! -newer "$RUNNER_TEMP/go-sdk-start" -printf '%h\0' | xargs -0r rm -rf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gen-blob-test
          path: ${{ runner.temp }}/gen-blob/test.json
          if-no-files-found: error
          retention-days: 1
      - run: bun run test:consumers
      - run: bun run test:e2e

  # gen's rust project, the last group (Ff11): its toolchain files (shared/*.toolchains.test.ts) and
  # mutation-harness.test.ts run Go and Python too, so both are installed and their caches restored, never saved:
  # the test job and gen-python own them. This job owns the Rust cache, the heaviest, so the Rust mutants the
  # harness builds stay in it.
  gen-rust:
    name: gen (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # vitest runs on node
      - uses: actions/setup-node@v4
        with:
          node-version: current
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/honey-tmp/go/mod
          key: ${{ runner.os }}-gomod-test-${{ hashFiles('.go-version', 'packages/gen/src/emit/go/__fixtures__/go-env.ts', 'packages/gen/src/emit/go/sdk.ts') }}
          restore-keys: ${{ runner.os }}-gomod-test-
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/honey-tmp/go/cache
            ~/.cache/honey-tmp/go/sdk
          key: >-
            ${{ runner.os }}-gobuild-${{ hashFiles('.go-version', 'packages/gen/src/emit/go/**',
            'packages/gen/src/emit/shared/**', 'packages/gen/src/ir/**', 'packages/gen/src/runtime/go/**',
            'packages/gen/tests/security/**', 'packages/gen/tests/structure/mutation-harness*.ts',
            'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/matrix.ts') }}
          restore-keys: ${{ runner.os }}-gobuild-
      # gen compiles the emitted Rust at the toolchain rust-toolchain.toml pins (RUSTUP_TOOLCHAIN through its
      # rust-env fixture) and checks it at the RUST_FLOOR toolchain. A bare install reads the file; the default
      # follows it, so any other cargo in the job runs the pin too. Toolchains are not cached: a minimal one
      # installs in seconds.
      - name: Rust (rust-toolchain.toml, and the RUST_FLOOR toolchain)
        run: |
          rustup toolchain install
          rustup default "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install 1.85.0 --profile minimal --component clippy
      # the registry, both target dirs and the compiled crates (rust/__fixtures__/compiled.ts), keyed like
      # gobuild on every input of a Rust compile (toolchain-projects.test.ts holds it to that); the emitted
      # crates carry their lock, so the registry changes only with what the key already hashes
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/honey-tmp/rust/cargo
            ~/.cache/honey-tmp/rust/target
            ~/.cache/honey-tmp/rust/target-1.85.0
            ~/.cache/honey-tmp/rust/sdk
          key: >-
            ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml', 'packages/gen/src/emit/rust/**',
            'packages/gen/src/emit/shared/**', 'packages/gen/src/ir/**', 'packages/gen/src/runtime/rust/**',
            'packages/gen/tests/security/**', 'packages/gen/tests/structure/mutation-harness*.ts',
            'packages/gen/tests/structure/rust-toolchain.test.ts', 'packages/gen/tests/structure/compile-calls.ts',
            'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/matrix.ts') }}
          restore-keys: ${{ runner.os }}-rust-
      # gen runs every Python command through its python-env fixture, installed as in gen-python (which says why)
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version-file: uv.toml
          enable-cache: false
      - name: Python (uv.toml's uv, .python-version, and the PY_FLOOR interpreter)
        run: |
          UV_CACHE_DIR="$HOME/.cache/honey-tmp/python/uv-cache" UV_TOOL_DIR="$HOME/.cache/honey-tmp/python/uv/tools" UV_TOOL_BIN_DIR="$HOME/.cache/honey-tmp/python/uv/bin" uv tool install --no-config --no-python-downloads uv=="$(sed -n 's/^required-version = "==\(.*\)"$/\1/p' uv.toml)"
          UV_CACHE_DIR="$HOME/.cache/honey-tmp/python/uv-cache" UV_PYTHON_INSTALL_DIR="$HOME/.cache/honey-tmp/python/pythons" UV_PYTHON_BIN_DIR="$HOME/.cache/honey-tmp/python/pybin" "$HOME/.cache/honey-tmp/python/uv/bin/uv" python install --no-bin "$(cat .python-version)" 3.11.4
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/honey-tmp/python/mypy
            ~/.cache/honey-tmp/python/sdk
          key: >-
            ${{ runner.os }}-python-${{ hashFiles('.python-version', 'uv.toml', 'packages/gen/src/emit/python/**',
            'packages/gen/src/emit/shared/**', 'packages/gen/src/ir/**', 'packages/gen/src/runtime/python/**',
            'packages/gen/tests/security/**', 'packages/gen/tests/structure/mutation-harness*.ts',
            'packages/gen/tests/structure/python-toolchain.test.ts', 'packages/gen/tests/structure/compile-calls.ts',
            'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/matrix.ts') }}
          restore-keys: ${{ runner.os }}-python-
      - run: mkdir -p ~/.cache/honey-tmp/rust/sdk && touch "$RUNNER_TEMP/rust-sdk-start"
      - run: bun install --frozen-lockfile
      - name: gen (rust)
        working-directory: packages/gen
        run: >-
          bunx vitest run --project rust --coverage --coverage.thresholds.lines=0
          --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0
          --reporter=default --reporter=blob --outputFile.blob="$RUNNER_TEMP/gen-blob/rust.json"
        env:
          HONEY_REQUIRE_TOOLCHAINS: "1"
      # as in the test job: the saved cache keeps only the Rust SDKs this run built or reused. Only the rust
      # project compiles Rust SDKs
      - name: Prune the Rust SDKs this run did not use
        run: >-
          find ~/.cache/honey-tmp/rust/sdk -mindepth 2 -maxdepth 2 -name .complete
          ! -newer "$RUNNER_TEMP/rust-sdk-start" -printf '%h\0' | xargs -0r rm -rf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gen-blob-rust
          path: ${{ runner.temp }}/gen-blob/rust.json
          if-no-files-found: error
          retention-days: 1

  # gen's python project: its files reach Python alone (vitest.config.ts). This job owns the Python cache.
  gen-python:
    name: gen (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # vitest runs on node
      - uses: actions/setup-node@v4
        with:
          node-version: current
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # gen runs every Python command through its python-env fixture, with the uv uv.toml pins and the interpreters
      # .python-version and PY_FLOOR name, all under ~/.cache/honey-tmp/python and linked nowhere (--no-bin).
      # setup-uv provides a uv at that pin (required-version fails any other), which installs the pinned uv into the
      # cache, which installs the interpreters: the commands a missing one names locally. None is cached: each
      # installs in about a second.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version-file: uv.toml
          enable-cache: false
      - name: Python (uv.toml's uv, .python-version, and the PY_FLOOR interpreter)
        run: |
          UV_CACHE_DIR="$HOME/.cache/honey-tmp/python/uv-cache" UV_TOOL_DIR="$HOME/.cache/honey-tmp/python/uv/tools" UV_TOOL_BIN_DIR="$HOME/.cache/honey-tmp/python/uv/bin" uv tool install --no-config --no-python-downloads uv=="$(sed -n 's/^required-version = "==\(.*\)"$/\1/p' uv.toml)"
          UV_CACHE_DIR="$HOME/.cache/honey-tmp/python/uv-cache" UV_PYTHON_INSTALL_DIR="$HOME/.cache/honey-tmp/python/pythons" UV_PYTHON_BIN_DIR="$HOME/.cache/honey-tmp/python/pybin" "$HOME/.cache/honey-tmp/python/uv/bin/uv" python install --no-bin "$(cat .python-version)" 3.11.4
      # the gated SDKs and their mypy caches (python/__fixtures__/compiled.ts), keyed like gobuild and rust on every
      # input of a Python gate (toolchain-projects.test.ts holds it to that). uv's wheel cache is not saved: a venv
      # fetches its wheels once per run, then installs offline, and the markers that vouch for them go with it.
      # This job saves it; gen-rust only restores it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/honey-tmp/python/mypy
            ~/.cache/honey-tmp/python/sdk
          key: >-
            ${{ runner.os }}-python-${{ hashFiles('.python-version', 'uv.toml', 'packages/gen/src/emit/python/**',
            'packages/gen/src/emit/shared/**', 'packages/gen/src/ir/**', 'packages/gen/src/runtime/python/**',
            'packages/gen/tests/security/**', 'packages/gen/tests/structure/mutation-harness*.ts',
            'packages/gen/tests/structure/python-toolchain.test.ts', 'packages/gen/tests/structure/compile-calls.ts',
            'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/matrix.ts') }}
          restore-keys: ${{ runner.os }}-python-
      - run: mkdir -p ~/.cache/honey-tmp/python/sdk && touch "$RUNNER_TEMP/python-sdk-start"
      - run: bun install --frozen-lockfile
      - name: gen (python)
        working-directory: packages/gen
        run: >-
          bunx vitest run --project python --coverage --coverage.thresholds.lines=0
          --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0
          --reporter=default --reporter=blob --outputFile.blob="$RUNNER_TEMP/gen-blob/python.json"
        env:
          HONEY_REQUIRE_TOOLCHAINS: "1"
      - name: Prune the Python SDKs this run did not use
        run: >-
          find ~/.cache/honey-tmp/python/sdk -mindepth 2 -maxdepth 2 -name .complete
          ! -newer "$RUNNER_TEMP/python-sdk-start" -printf '%h\0' | xargs -0r rm -rf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gen-blob-python
          path: ${{ runner.temp }}/gen-blob/python.json
          if-no-files-found: error
          retention-days: 1

  # gen's coverage: the three shards' blobs merged, held to the per-file 100% thresholds in vitest.config.ts
  gen-coverage:
    name: gen coverage
    needs: [test, gen-rust, gen-python]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: current
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: gen-blob-*
          path: ${{ runner.temp }}/gen-blob
          merge-multiple: true
      - working-directory: packages/gen
        run: bunx vitest run --merge-reports "$RUNNER_TEMP/gen-blob" --coverage

  runtimes:
    name: runtime integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Node 22.12 has no shouldUpgradeCallback, so it exercises the adapter's 'upgrade' fallback
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          package-manager-cache: false
      - run: echo "HONEY_TEST_NODE_LEGACY=$(which node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: current
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # the same app over raw sockets on Node (current and 22.12) and Bun
      - working-directory: _v0
        run: >-
          bunx vitest run tests/integration/hostile-client tests/integration/stream-lifecycle
          tests/integration/request-target

  hotpath:
    name: hot-path benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # v1's app.fetch cost as a ratio to a raw fetch handler, against v0's ratios in
      # blueprint/baselines/hotpath.json (recorded with BUN_VERSION). One retry absorbs a noisy
      # neighbor; two failures are a regression.
      - run: bun run bench:hotpath || bun run bench:hotpath
      # v1's finalize cost against v0's, in the same process: no baseline, no machine dependence
      - run: bun run bench:finalize || bun run bench:finalize
      # streaming throughput and cancel-to-release latency against v0's, in the same process
      - run: bun run bench:streaming || bun run bench:streaming
      # the Node bridge's per-request cost against v0's, on Node itself (node:http under Bun is
      # Bun's own implementation); a bare node:http handler is the reported floor
      - uses: actions/setup-node@v4
        with:
          node-version: current
      - run: bun run bench:adapter || bun run bench:adapter

  build:
    name: build (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v4
      # the node tier runs the built bundles on the oldest supported Node line, not the image default
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run generate
      # --check-generated: the checkout is clean here, so a build that rewrites a
      # committed generated file means it is stale or codegen is not deterministic.
      - run: bun packages/core/tests/e2e/run-build.ts --runtime ${{ matrix.runtime }} --check-generated

  packaging:
    name: packaging (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # the oldest supported LTS and the current release: Node behavior differs across versions
        node: ["22", "current"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # packs the real tarball, type-checks a consumer with every strictness flag on, then runs
      # it on Bun and on plain Node: the core entry, honey generate, and vite build with the
      # honey plugins. Every other tier runs honey from source, so nothing else can see this.
      - run: bun run test:packaging

  e2e:
    name: e2e (${{ matrix.runtime }}${{ matrix.node && format(' {0}', matrix.node) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node
            node: "22"
            script: test:e2e:node
          - runtime: node
            node: "current"
            script: test:e2e:node
          - runtime: cf-workers
            script: test:e2e:cf
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # cf-workers still runs node for wrangler, playwright and the type-stripped fixtures
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node || 'current' }}
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run generate
      - run: bun run ${{ matrix.script }}

  harness:
    name: harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # vitest and the emitted SDK's WebSocket run on node: the global WebSocket needs Node >= 22
      - uses: actions/setup-node@v4
        with:
          node-version: current
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # the pinned Go, the same as the test job and every local run; emitted go.mod files keep the go
      # 1.24 floor (`omitzero` on tri-state fields), which go vet enforces
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      # the pinned and floor toolchains and the WebSocket module: a change in any saves a new cache
      - uses: actions/cache@v4
        with:
          path: ~/.cache/honey-tmp/go/mod
          key: ${{ runner.os }}-gomod-harness-${{ hashFiles('.go-version', 'packages/gen/src/emit/go/__fixtures__/go-env.ts', 'packages/gen/src/emit/go/sdk.ts') }}
          restore-keys: ${{ runner.os }}-gomod-harness-
      # gen runs every Python command through its python-env fixture, with the uv uv.toml pins and the interpreters
      # .python-version and PY_FLOOR name, all under ~/.cache/honey-tmp/python and linked nowhere (--no-bin).
      # setup-uv provides a uv at that pin (required-version fails any other), which installs the pinned uv into the
      # cache, which installs the interpreters: the commands a missing one names locally. None is cached: each
      # installs in about a second.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version-file: uv.toml
          enable-cache: false
      - name: Python (uv.toml's uv, .python-version, and the PY_FLOOR interpreter)
        run: |
          UV_CACHE_DIR="$HOME/.cache/honey-tmp/python/uv-cache" UV_TOOL_DIR="$HOME/.cache/honey-tmp/python/uv/tools" UV_TOOL_BIN_DIR="$HOME/.cache/honey-tmp/python/uv/bin" uv tool install --no-config --no-python-downloads uv=="$(sed -n 's/^required-version = "==\(.*\)"$/\1/p' uv.toml)"
          UV_CACHE_DIR="$HOME/.cache/honey-tmp/python/uv-cache" UV_PYTHON_INSTALL_DIR="$HOME/.cache/honey-tmp/python/pythons" UV_PYTHON_BIN_DIR="$HOME/.cache/honey-tmp/python/pybin" "$HOME/.cache/honey-tmp/python/uv/bin/uv" python install --no-bin "$(cat .python-version)" 3.11.4
      # gen compiles the emitted Rust at the toolchain rust-toolchain.toml pins (RUSTUP_TOOLCHAIN through its
      # rust-env fixture) and checks it at the RUST_FLOOR toolchain. A bare install reads the file; the default
      # follows it, so any other cargo in the job runs the pin too. Toolchains are not cached: a minimal one
      # installs in seconds.
      - name: Rust (rust-toolchain.toml, and the RUST_FLOOR toolchain)
        run: |
          rustup toolchain install
          rustup default "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install 1.85.0 --profile minimal --component clippy
      # gen's Rust caches for the toolchain files run below, keyed as in the test job
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/honey-tmp/rust/cargo
            ~/.cache/honey-tmp/rust/target
            ~/.cache/honey-tmp/rust/target-1.85.0
            ~/.cache/honey-tmp/rust/sdk
          key: >-
            ${{ runner.os }}-rust-harness-${{ hashFiles('rust-toolchain.toml', 'packages/gen/src/emit/rust/**',
            'packages/gen/src/emit/shared/**', 'packages/gen/src/ir/**', 'packages/gen/src/runtime/rust/**',
            'packages/gen/tests/security/**', 'packages/gen/tests/structure/mutation-harness*.ts',
            'packages/gen/tests/structure/rust-toolchain.test.ts', 'packages/gen/tests/structure/compile-calls.ts',
            'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/matrix.ts',
            'packages/core/tests/integration/conformance/**') }}
          restore-keys: ${{ runner.os }}-rust-harness-
      # the gated SDKs and their mypy caches (python/__fixtures__/compiled.ts), keyed like gobuild and rust on every
      # input of a Python gate (toolchain-projects.test.ts holds it to that). uv's wheel cache is not saved: a venv
      # fetches its wheels once per run, then installs offline, and the markers that vouch for them go with it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/honey-tmp/python/mypy
            ~/.cache/honey-tmp/python/sdk
          key: >-
            ${{ runner.os }}-python-harness-${{ hashFiles('.python-version', 'uv.toml', 'packages/gen/src/emit/python/**',
            'packages/gen/src/emit/shared/**', 'packages/gen/src/ir/**', 'packages/gen/src/runtime/python/**',
            'packages/gen/tests/security/**', 'packages/gen/tests/structure/mutation-harness*.ts',
            'packages/gen/tests/structure/python-toolchain.test.ts', 'packages/gen/tests/structure/compile-calls.ts',
            'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/matrix.ts',
            'packages/core/tests/integration/conformance/**') }}
          restore-keys: ${{ runner.os }}-python-harness-
      # v0's emitted crates resolve crates.io without a lockfile, so their dependencies drift: key the
      # cache by ISO week, restore the newest, and save it even when the run fails (below), so each
      # week compiles the drift once and every later run starts warm. v0's tests pin their own target
      # dir (_v0/tests/cargo-env.ts, byte-frozen until bit 20), so it stays in the checkout.
      - id: cargo-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/cargo-target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '_v0/src/client-rust/**', '_v0/src/codegen-rust.ts') }}-${{ steps.cargo-week.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '_v0/src/client-rust/**', '_v0/src/codegen-rust.ts') }}-
            ${{ runner.os }}-cargo-
      # v0's frozen harness on the pinned interpreter, with its one pinned list for CI and local runs (locally
      # the harness fills .cache/python-venv from it); HONEY_PYTHON's bare python, ruff and mypy resolve here
      - name: v0's harness Python (the pinned interpreter, _v0's pinned requirements)
        run: |
          export UV_CACHE_DIR="$HOME/.cache/honey-tmp/python/uv-cache" UV_PYTHON_INSTALL_DIR="$HOME/.cache/honey-tmp/python/pythons"
          "$HOME/.cache/honey-tmp/python/uv/bin/uv" venv --python "$(cat .python-version)" "$HOME/.cache/honey-tmp/python/v0-venv"
          "$HOME/.cache/honey-tmp/python/uv/bin/uv" pip install --python "$HOME/.cache/honey-tmp/python/v0-venv/bin/python" -r _v0/tests/python-requirements.txt
          echo "$HOME/.cache/honey-tmp/python/v0-venv/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: mkdir -p ~/.cache/honey-tmp/rust/sdk && touch "$RUNNER_TEMP/rust-sdk-start"
      - run: mkdir -p ~/.cache/honey-tmp/python/sdk && touch "$RUNNER_TEMP/python-sdk-start"
      - run: bun run test:harness
        env:
          HONEY_PYTHON: python
          # a Python problem fails the job instead of skipping the Python SDK tests
          HONEY_REQUIRE_PYTHON: "1"
          # a missing Go, Rust or Python fails gen's conformance and harness files for it instead of skipping them
          HONEY_REQUIRE_TOOLCHAINS: "1"
      # as in the test job: the saved cache keeps only the Rust SDKs this run built or reused
      - name: Prune the Rust SDKs this run did not use
        run: >-
          find ~/.cache/honey-tmp/rust/sdk -mindepth 2 -maxdepth 2 -name .complete
          ! -newer "$RUNNER_TEMP/rust-sdk-start" -printf '%h\0' | xargs -0r rm -rf
      - name: Prune the Python SDKs this run did not use
        run: >-
          find ~/.cache/honey-tmp/python/sdk -mindepth 2 -maxdepth 2 -name .complete
          ! -newer "$RUNNER_TEMP/python-sdk-start" -printf '%h\0' | xargs -0r rm -rf
      - if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/cargo-target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
