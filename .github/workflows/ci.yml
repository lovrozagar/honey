name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"

jobs:
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint commit messages
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  check:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run generate
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:consumers

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run generate
      - run: bun run test
      - run: bun run test:consumers
      - run: bun run test:e2e

  runtimes:
    name: runtime integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Node 22.12 has no shouldUpgradeCallback, so it exercises the adapter's 'upgrade' fallback
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          package-manager-cache: false
      - run: echo "HONEY_TEST_NODE_LEGACY=$(which node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: current
          package-manager-cache: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # the same app over raw sockets on Node (current and 22.12), Bun and Deno
      - working-directory: packages/core
        run: >-
          bunx vitest run tests/integration/hostile-client tests/integration/stream-lifecycle
          tests/integration/request-target

  hotpath:
    name: hot-path benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # app.fetch cost as a ratio to a raw fetch handler, against bench/hotpath-baseline.json
      # (recorded with BUN_VERSION). One retry absorbs a noisy neighbor; two failures are a regression.
      - run: bun run bench:hotpath || bun run bench:hotpath

  build:
    name: build (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run generate
      # --check-generated: the checkout is clean here, so a build that rewrites a
      # committed generated file means it is stale or codegen is not deterministic.
      - run: bun e2e/run-build.ts --runtime ${{ matrix.runtime }} --check-generated

  packaging:
    name: packaging (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # the oldest supported LTS and the current release: Node behavior differs across versions
        node: ["22", "current"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # packs the real tarball, type-checks a consumer with every strictness flag on, then runs
      # it on Bun and on plain Node: the core entry, honey generate, and vite build with the
      # honey plugins. Every other tier runs honey from source, so nothing else can see this.
      - run: bun run test:packaging

  e2e:
    name: e2e (${{ matrix.runtime }}${{ matrix.node && format(' {0}', matrix.node) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node
            node: "22"
            script: test:e2e:node
          - runtime: node
            node: "current"
            script: test:e2e:node
          - runtime: deno
            script: test:e2e:deno
          - runtime: cf-workers
            script: test:e2e:cf
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        if: matrix.node
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x
      - run: bun install --frozen-lockfile
      - run: bun run generate
      - run: bun run ${{ matrix.script }}

  harness:
    name: harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@v5
        with:
          # generated go.mod files say go 1.24 (`omitzero` on tri-state fields)
          go-version: "1.24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/cargo-target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/core/src/client-rust/**', 'packages/core/src/codegen-rust.ts') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      # one pinned list for CI and local runs (locally the harness fills .cache/python-venv from it)
      - run: pip install -r packages/core/tests/python-requirements.txt
      - run: bun install --frozen-lockfile
      - run: bun run test:harness
        env:
          HONEY_PYTHON: python
          # a Python problem fails the job instead of skipping the Python SDK tests
          HONEY_REQUIRE_PYTHON: "1"
