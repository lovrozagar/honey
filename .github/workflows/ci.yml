name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bench_mode:
        description: "judge the bench gates, or record their RATIO lines for a re-record (00-rules perf gate)"
        type: choice
        options: [judge, record]
        default: judge
      build_mode:
        description: "judge the e2e build-time ratios, or record their RATIO lines for blueprint/baselines/build.json"
        type: choice
        options: [judge, record]
        default: judge
  # release.yml runs all of it on the tagged commit before it publishes
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"

jobs:
  # The Node every other job calls current: the newest RELEASE in nodejs.org's index, resolved once here and fed to
  # each setup-node that is not pinned (a matrix's "current" maps to it). setup-node's own `current` takes the index's
  # top entry, a prerelease the day one ships (CI 40952484194: v27.0.0-alpha.0.0.0); a failed fetch fails the run.
  node-current:
    name: node current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: resolve
        run: bun packages/core/tests/build/node-current.ts
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint commit messages
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  check:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run generate
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:consumers

  # v0, v1, the bench, and gen's unit and go projects, then the consumers and e2e. Gen's rust and python projects
  # run beside it in gen-rust and gen-python, and gen-coverage holds the three shards' merged coverage to gen's
  # thresholds (contract 28 §8.3). CI calls the root `test` script's parts, each run whatever an earlier one did,
  # as its `;` does; the script itself stays the local run of all of them.
  test:
    name: test
    needs: node-current
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # the integration suites run server fixtures as `node x.ts`: they need Node's type stripping,
      # which the runner image's default Node may not have
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ needs.node-current.outputs.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # gen compiles and runs the emitted Go SDK at the toolchain .go-version pins (GOTOOLCHAIN through
      # its go-env fixture), with the module cache and the pinned toolchain under ~/.cache/honey-tmp/go
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: .go-version
          cache: false
      # the pinned and floor toolchains and the WebSocket module: a change in any saves a new cache
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/honey-tmp/go/mod
          key: ${{ runner.os }}-gomod-test-${{ hashFiles('.go-version', 'packages/gen/src/emit/go/__fixtures__/go-env.ts', 'packages/gen/src/emit/go/sdk.ts') }}
          restore-keys: ${{ runner.os }}-gomod-test-
      # the Go build cache and the compiled SDKs (go/__fixtures__/compiled.ts), each SDK dir named by the hash
      # of what it holds. The key hashes every input of what gets compiled (toolchain-projects.test.ts holds
      # it to that), so a commit that changes none restores every SDK and compiles nothing; a changed input
      # restores the last set and rebuilds only the SDKs whose content changed. It is apart from the module
      # cache above (no shared path), which changes only with the toolchains and the dependency set. This job
      # saves both; gen-rust only restores them.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/honey-tmp/go/cache
            ~/.cache/honey-tmp/go/sdk
          key: >-
            ${{ runner.os }}-gobuild-${{ hashFiles('.go-version', 'packages/gen/src/emit/go/**',
            'packages/gen/src/emit/cli/**', 'packages/gen/src/emit/shared/**', 'packages/gen/src/ir/**',
            'packages/gen/src/runtime/go/**', 'packages/gen/src/runtime/cli/**', 'packages/gen/src/cli.test.ts',
            'packages/gen/scripts/sdk-budget.cli.test.ts',
            'packages/gen/tests/security/**', 'packages/gen/tests/structure/mutation-harness*.ts',
            'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/features-mcp.ts', 'packages/gen/tests/integration/conformance/features-sdk.ts',
            'packages/gen/tests/integration/conformance/cells.ts',
            'packages/gen/tests/integration/conformance/matrix.ts') }}
          restore-keys: ${{ runner.os }}-gobuild-
      - run: touch "$RUNNER_TEMP/go-sdk-start"
      - run: bun install --frozen-lockfile
      # the CLI's generated files are checked by pinned tools (cli/__fixtures__/tools.ts): fish, zsh and PowerShell for
      # the completion scripts and install.ps1, goreleaser for the release config, shellcheck for install.sh, each at the
      # release tool-pins.json pins by sha256, under ~/.cache/honey-tmp/tools: the command a missing tool names
      - name: Tools (tool-pins.json's fish, zsh, PowerShell, goreleaser and shellcheck)
        run: P="$(git rev-parse --show-toplevel)/packages/gen/src/emit/cli/__fixtures__/tool-pins.json" && D="$HOME/.cache/honey-tmp/tools" && mkdir -p "$D/dl" && for k in $(jq -r 'keys[]' "$P"); do U="$(jq -r --arg k "$k" '.[$k].url' "$P")" && R="$(jq -r --arg k "$k" '.[$k].dir' "$P")" && curl -fsSL -o "$D/dl/$k" "$U" && echo "$(jq -r --arg k "$k" '.[$k].sha256' "$P")  $D/dl/$k" | sha256sum -c - && rm -rf "$D/$R" "$D/$R.partial" && mkdir -p "$D/$R.partial" && tar -xf "$D/dl/$k" -C "$D/$R.partial" && chmod +x "$D/$R.partial/$(jq -r --arg k "$k" '.[$k].bin' "$P")" && mv "$D/$R.partial" "$D/$R" && rm "$D/dl/$k" || exit 1; done
      # the MCP server's legs drive it with the official clients (mcp/__fixtures__/clients.ts), pinned by client-lock.json:
      # npm ci checks every package's integrity
      - name: MCP clients (client-lock.json's @modelcontextprotocol/sdk and @modelcontextprotocol/client)
        run: P="$(git rev-parse --show-toplevel)/packages/gen/src/emit/mcp/__fixtures__" && D="$HOME/.cache/honey-tmp/mcp-clients" && rm -rf "$D.partial" && mkdir -p "$D.partial" && cp "$P/client-pins.json" "$D.partial/package.json" && cp "$P/client-lock.json" "$D.partial/package-lock.json" && (cd "$D.partial" && npm ci --ignore-scripts --no-audit --no-fund) && sha256sum "$P/client-lock.json" | cut -d" " -f1 > "$D.partial/lock.sha256" && rm -rf "$D" && mv "$D.partial" "$D"
      - run: bun run generate
      - if: ${{ !cancelled() }}
        run: bun run test:v1
        env:
          # runtime-bundle's legs build with the pinned Bun (packageManager): a missing one fails instead of skipping
          HONEY_REQUIRE_TOOLCHAINS: "1"
      # gen's shard: thresholds off here, since a shard covers only what its projects run; gen-coverage holds the
      # merge to them. The blob carries the results and the coverage, and the default reporter prints the run.
      - name: gen (unit and go)
        if: ${{ !cancelled() }}
        working-directory: packages/gen
        run: >-
          bunx vitest run --project unit --project go --coverage --coverage.thresholds.lines=0
          --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0
          --reporter=default --reporter=blob --outputFile.blob="$RUNNER_TEMP/gen-blob/test.json"
        env:
          # a missing toolchain fails the run instead of skipping its tests
          HONEY_REQUIRE_TOOLCHAINS: "1"
      - if: ${{ !cancelled() }}
        run: bun run test:bench
      # every SDK dir this run built or reused has a .complete newer than the start; the rest are stale
      # (their inputs changed), so the saved cache stays one run's SDKs instead of growing with each change.
      # Only the go project compiles SDKs, so the other shards use none of them.
      - name: Prune the Go SDKs this run did not use
        run: >-
          find ~/.cache/honey-tmp/go/sdk -mindepth 2 -maxdepth 2 -name .complete
          ! -newer "$RUNNER_TEMP/go-sdk-start" -printf '%h\0' | xargs -0r rm -rf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gen-blob-test
          path: ${{ runner.temp }}/gen-blob/test.json
          if-no-files-found: error
          retention-days: 1
      - run: bun run test:consumers
      - run: bun run test:e2e

  # gen's rust project, the last group (Ff11): its toolchain files (shared/*.toolchains.test.ts) and
  # mutation-harness.test.ts run Go, Python and .NET too, so all three are installed and their caches restored,
  # never saved: the test job, gen-python and gen-csharp own them. This job owns the Rust cache, the heaviest, so
  # the Rust mutants the harness builds stay in it.
  gen-rust:
    name: gen (rust)
    needs: node-current
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # vitest runs on node
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ needs.node-current.outputs.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/honey-tmp/go/mod
          key: ${{ runner.os }}-gomod-test-${{ hashFiles('.go-version', 'packages/gen/src/emit/go/__fixtures__/go-env.ts', 'packages/gen/src/emit/go/sdk.ts') }}
          restore-keys: ${{ runner.os }}-gomod-test-
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/honey-tmp/go/cache
            ~/.cache/honey-tmp/go/sdk
          key: >-
            ${{ runner.os }}-gobuild-${{ hashFiles('.go-version', 'packages/gen/src/emit/go/**',
            'packages/gen/src/emit/cli/**', 'packages/gen/src/emit/shared/**', 'packages/gen/src/ir/**',
            'packages/gen/src/runtime/go/**', 'packages/gen/src/runtime/cli/**', 'packages/gen/src/cli.test.ts',
            'packages/gen/scripts/sdk-budget.cli.test.ts',
            'packages/gen/tests/security/**', 'packages/gen/tests/structure/mutation-harness*.ts',
            'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/features-mcp.ts', 'packages/gen/tests/integration/conformance/features-sdk.ts',
            'packages/gen/tests/integration/conformance/cells.ts',
            'packages/gen/tests/integration/conformance/matrix.ts') }}
          restore-keys: ${{ runner.os }}-gobuild-
      # gen compiles the emitted Rust at the toolchain rust-toolchain.toml pins (RUSTUP_TOOLCHAIN through its
      # rust-env fixture) and checks it at the RUST_FLOOR toolchain. A bare install reads the file; the default
      # follows it, so any other cargo in the job runs the pin too. Toolchains are not cached: a minimal one
      # installs in seconds.
      - name: Rust (rust-toolchain.toml, and the RUST_FLOOR toolchain)
        run: |
          rustup toolchain install
          rustup default "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install 1.85.0 --profile minimal --component clippy
      # the registry, both target dirs and the compiled crates (rust/__fixtures__/compiled.ts), keyed like
      # gobuild on every input of a Rust compile (toolchain-projects.test.ts holds it to that); the emitted
      # crates carry their lock, so the registry changes only with what the key already hashes
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/honey-tmp/rust/cargo
            ~/.cache/honey-tmp/rust/target
            ~/.cache/honey-tmp/rust/target-1.85.0
            ~/.cache/honey-tmp/rust/sdk
          key: >-
            ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml', 'packages/gen/src/emit/rust/**',
            'packages/gen/src/emit/shared/**', 'packages/gen/src/ir/**', 'packages/gen/src/runtime/rust/**',
            'packages/gen/tests/security/**', 'packages/gen/tests/structure/mutation-harness*.ts',
            'packages/gen/tests/structure/rust-toolchain.test.ts', 'packages/gen/tests/structure/compile-calls.ts',
            'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/features-mcp.ts', 'packages/gen/tests/integration/conformance/features-sdk.ts',
            'packages/gen/tests/integration/conformance/cells.ts',
            'packages/gen/tests/integration/conformance/matrix.ts') }}
          restore-keys: ${{ runner.os }}-rust-
      # gen runs every Python command through its python-env fixture, installed as in gen-python (which says why)
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.toml
          enable-cache: false
      - name: Python (uv.toml's uv, .python-version, and the PY_FLOOR interpreter)
        run: |
          UV_CACHE_DIR="$HOME/.cache/honey-tmp/python/uv-cache" UV_TOOL_DIR="$HOME/.cache/honey-tmp/python/uv/tools" UV_TOOL_BIN_DIR="$HOME/.cache/honey-tmp/python/uv/bin" uv tool install --no-config --no-python-downloads uv=="$(sed -n 's/^required-version = "==\(.*\)"$/\1/p' uv.toml)"
          UV_CACHE_DIR="$HOME/.cache/honey-tmp/python/uv-cache" UV_PYTHON_INSTALL_DIR="$HOME/.cache/honey-tmp/python/pythons" UV_PYTHON_BIN_DIR="$HOME/.cache/honey-tmp/python/pybin" "$HOME/.cache/honey-tmp/python/uv/bin/uv" python install --no-bin "$(cat .python-version)" 3.11.4
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/honey-tmp/python/mypy
            ~/.cache/honey-tmp/python/sdk
          key: >-
            ${{ runner.os }}-python-${{ hashFiles('.python-version', 'uv.toml', 'packages/gen/src/emit/python/**',
            'packages/gen/src/emit/shared/**', 'packages/gen/src/ir/**', 'packages/gen/src/runtime/python/**',
            'packages/gen/tests/security/**', 'packages/gen/tests/structure/mutation-harness*.ts',
            'packages/gen/tests/structure/python-toolchain.test.ts', 'packages/gen/tests/structure/compile-calls.ts',
            'packages/gen/src/emit/mcp/python-client.test.ts', 'packages/gen/src/emit/mcp/__fixtures__/python-client.ts',
            'packages/gen/src/emit/mcp/python-oauth.test.ts',
            'packages/gen/src/emit/mcp/__fixtures__/client-constraints.txt',
            'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/features-mcp.ts', 'packages/gen/tests/integration/conformance/features-sdk.ts',
            'packages/gen/tests/integration/conformance/cells.ts',
            'packages/gen/tests/integration/conformance/matrix.ts') }}
          restore-keys: ${{ runner.os }}-python-
      # gen runs every dotnet through its csharp-env fixture, installed as in gen-csharp (which says why)
      - name: .NET (global.json's SDK, and the seed restore)
        run: |
          V="$(sed -n 's/.*"version": "\(.*\)",/\1/p' global.json)" && D="$HOME/.cache/honey-tmp/dotnet" && F="$(git rev-parse --show-toplevel)/packages/gen/src/emit/csharp/__fixtures__" && T="$D/toolchain/$V" && mkdir -p "$D/dl" "$D/home" "$D/tmp" && curl -fsSL -o "$D/dl/dotnet-sdk-$V-linux-x64.tar.gz" "https://builds.dotnet.microsoft.com/dotnet/Sdk/$V/dotnet-sdk-$V-linux-x64.tar.gz" && (cd "$D/dl" && sha512sum -c "$F/dotnet-sdk.sha512") && rm -rf "$T" "$T.partial" && mkdir -p "$T.partial" && tar -xzf "$D/dl/dotnet-sdk-$V-linux-x64.tar.gz" -C "$T.partial" && mv "$T.partial" "$T" && rm "$D/dl/dotnet-sdk-$V-linux-x64.tar.gz" && DOTNET_CLI_HOME="$D/home" DOTNET_ROOT="$D/toolchain/$V" NUGET_HTTP_CACHE_PATH="$D/nuget-http" NUGET_PACKAGES="$D/nuget" NUGET_PLUGINS_CACHE_PATH="$D/nuget-plugins" TMPDIR="$D/tmp" HOME="$D/home" DOTNET_ADD_GLOBAL_TOOLS_TO_PATH="false" DOTNET_CLI_TELEMETRY_OPTOUT="1" DOTNET_CLI_UI_LANGUAGE="en" DOTNET_CLI_USE_MSBUILD_SERVER="0" DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE="1" DOTNET_GENERATE_ASPNET_CERTIFICATE="false" DOTNET_NOLOGO="1" DOTNET_SKIP_FIRST_TIME_EXPERIENCE="1" MSBUILDDISABLENODEREUSE="1" NUGET_XMLDOC_MODE="skip" UseSharedCompilation="false" "$T/dotnet" restore "$F/seed/Seed.csproj" --source https://api.nuget.org/v3/index.json --artifacts-path "$D/tmp/seed"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/honey-tmp/dotnet/nuget
            ~/.cache/honey-tmp/dotnet/sdk
            ~/.cache/honey-tmp/dotnet/driver
          key: >-
            ${{ runner.os }}-dotnet-${{ hashFiles('global.json', 'packages/gen/src/emit/csharp/**',
            'packages/gen/src/emit/csharp/**/.editorconfig', 'packages/gen/src/emit/shared/**', 'packages/gen/src/ir/**', 'packages/gen/src/runtime/csharp/**',
            'packages/gen/tests/security/**', 'packages/gen/tests/structure/mutation-harness*.ts',
            'packages/gen/tests/structure/csharp-toolchain.test.ts', 'packages/gen/tests/structure/compile-calls.ts',
            'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/features-mcp.ts', 'packages/gen/tests/integration/conformance/features-sdk.ts',
            'packages/gen/tests/integration/conformance/cells.ts',
            'packages/gen/tests/integration/conformance/matrix.ts') }}
          restore-keys: ${{ runner.os }}-dotnet-
      # gen runs every java, javac, google-java-format and Gradle through its java-env fixture: each pin in
      # java-pins.json (three JDKs, the formatter, Gradle, the Jackson set) fetched and checked against its sha256,
      # under ~/.cache/honey-tmp/java: the command a missing JDK names locally
      - name: Java (java-pins.json's JDKs, google-java-format, Gradle and the Jackson set)
        run: |
          P="$(git rev-parse --show-toplevel)/packages/gen/src/emit/java/__fixtures__/java-pins.json" && D="$HOME/.cache/honey-tmp/java" && G="$(jq -r .googleJavaFormat.version "$P")" && W="$(jq -r .gradle.version "$P")" && mkdir -p "$D/dl" "$D/toolchain" "$D/repo" "$D/tmp" && for k in $(jq -r '.jdk | keys[]' "$P"); do R="$(jq -r --arg k "$k" '.jdk[$k].release' "$P")" && curl -fsSL -o "$D/dl/$R.tar.gz" "$(jq -r --arg k "$k" '.jdk[$k].url' "$P")" && echo "$(jq -r --arg k "$k" '.jdk[$k].sha256' "$P")  "$D/dl/$R.tar.gz"" | sha256sum -c - && rm -rf "$D/toolchain/$R" "$D/toolchain/$R.partial" && mkdir -p "$D/toolchain/$R.partial" && tar -xzf "$D/dl/$R.tar.gz" -C "$D/toolchain/$R.partial" --strip-components=1 && mv "$D/toolchain/$R.partial" "$D/toolchain/$R" && rm "$D/dl/$R.tar.gz" || exit 1; done && curl -fsSL -o "$D/toolchain/google-java-format-$G.jar" "$(jq -r --arg k "$k" '.googleJavaFormat.url' "$P")" && echo "$(jq -r --arg k "$k" '.googleJavaFormat.sha256' "$P")  "$D/toolchain/google-java-format-$G.jar"" | sha256sum -c - && curl -fsSL -o "$D/dl/gradle.zip" "$(jq -r --arg k "$k" '.gradle.url' "$P")" && echo "$(jq -r --arg k "$k" '.gradle.sha256' "$P")  "$D/dl/gradle.zip"" | sha256sum -c - && rm -rf "$D/toolchain/gradle-$W" && unzip -q "$D/dl/gradle.zip" -d "$D/toolchain" && rm "$D/dl/gradle.zip" && for a in $(jq -r '.jackson.artifacts[].path' "$P"); do mkdir -p "$D/repo/$(dirname "$a")" && curl -fsSL -o "$D/repo/$a" "$(jq -r .jackson.repository "$P")/$a" && echo "$(jq -r --arg a "$a" '.jackson.artifacts[] | select(.path == $a) | .sha256' "$P")  $D/repo/$a" | sha256sum -c - || exit 1; done
      # restored, never saved: gen-java owns it
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/honey-tmp/java/sdk
            ~/.cache/honey-tmp/java/gradle-home
          key: >-
            ${{ runner.os }}-java-${{ hashFiles('packages/gen/src/emit/java/**', 'packages/gen/src/emit/shared/**',
            'packages/gen/src/ir/**', 'packages/gen/src/runtime/java/**', 'packages/gen/tests/security/**',
            'packages/gen/tests/structure/mutation-harness*.ts', 'packages/gen/tests/structure/java-toolchain.test.ts',
            'packages/gen/tests/structure/compile-calls.ts', 'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/features-mcp.ts', 'packages/gen/tests/integration/conformance/features-sdk.ts',
            'packages/gen/tests/integration/conformance/cells.ts',
            'packages/gen/tests/integration/conformance/matrix.ts') }}
          restore-keys: ${{ runner.os }}-java-
      - run: mkdir -p ~/.cache/honey-tmp/rust/sdk && touch "$RUNNER_TEMP/rust-sdk-start"
      - run: bun install --frozen-lockfile
      - name: gen (rust)
        working-directory: packages/gen
        run: >-
          bunx vitest run --project rust --coverage --coverage.thresholds.lines=0
          --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0
          --reporter=default --reporter=blob --outputFile.blob="$RUNNER_TEMP/gen-blob/rust.json"
        env:
          HONEY_REQUIRE_TOOLCHAINS: "1"
      # as in the test job: the saved cache keeps only the Rust SDKs this run built or reused. Only the rust
      # project compiles Rust SDKs
      - name: Prune the Rust SDKs this run did not use
        run: >-
          find ~/.cache/honey-tmp/rust/sdk -mindepth 2 -maxdepth 2 -name .complete
          ! -newer "$RUNNER_TEMP/rust-sdk-start" -printf '%h\0' | xargs -0r rm -rf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gen-blob-rust
          path: ${{ runner.temp }}/gen-blob/rust.json
          if-no-files-found: error
          retention-days: 1

  # gen's python project: its files reach Python alone (vitest.config.ts). This job owns the Python cache.
  gen-python:
    name: gen (python)
    needs: node-current
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # vitest runs on node
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ needs.node-current.outputs.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # gen runs every Python command through its python-env fixture, with the uv uv.toml pins and the interpreters
      # .python-version and PY_FLOOR name, all under ~/.cache/honey-tmp/python and linked nowhere (--no-bin).
      # setup-uv provides a uv at that pin (required-version fails any other), which installs the pinned uv into the
      # cache, which installs the interpreters: the commands a missing one names locally. None is cached: each
      # installs in about a second.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.toml
          enable-cache: false
      - name: Python (uv.toml's uv, .python-version, and the PY_FLOOR interpreter)
        run: |
          UV_CACHE_DIR="$HOME/.cache/honey-tmp/python/uv-cache" UV_TOOL_DIR="$HOME/.cache/honey-tmp/python/uv/tools" UV_TOOL_BIN_DIR="$HOME/.cache/honey-tmp/python/uv/bin" uv tool install --no-config --no-python-downloads uv=="$(sed -n 's/^required-version = "==\(.*\)"$/\1/p' uv.toml)"
          UV_CACHE_DIR="$HOME/.cache/honey-tmp/python/uv-cache" UV_PYTHON_INSTALL_DIR="$HOME/.cache/honey-tmp/python/pythons" UV_PYTHON_BIN_DIR="$HOME/.cache/honey-tmp/python/pybin" "$HOME/.cache/honey-tmp/python/uv/bin/uv" python install --no-bin "$(cat .python-version)" 3.11.4
      # the gated SDKs and their mypy caches (python/__fixtures__/compiled.ts), keyed like gobuild and rust on every
      # input of a Python gate (toolchain-projects.test.ts holds it to that). uv's wheel cache is not saved: a venv
      # fetches its wheels once per run, then installs offline, and the markers that vouch for them go with it.
      # This job saves it; gen-rust only restores it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/honey-tmp/python/mypy
            ~/.cache/honey-tmp/python/sdk
          key: >-
            ${{ runner.os }}-python-${{ hashFiles('.python-version', 'uv.toml', 'packages/gen/src/emit/python/**',
            'packages/gen/src/emit/shared/**', 'packages/gen/src/ir/**', 'packages/gen/src/runtime/python/**',
            'packages/gen/tests/security/**', 'packages/gen/tests/structure/mutation-harness*.ts',
            'packages/gen/tests/structure/python-toolchain.test.ts', 'packages/gen/tests/structure/compile-calls.ts',
            'packages/gen/src/emit/mcp/python-client.test.ts', 'packages/gen/src/emit/mcp/__fixtures__/python-client.ts',
            'packages/gen/src/emit/mcp/python-oauth.test.ts',
            'packages/gen/src/emit/mcp/__fixtures__/client-constraints.txt',
            'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/features-mcp.ts', 'packages/gen/tests/integration/conformance/features-sdk.ts',
            'packages/gen/tests/integration/conformance/cells.ts',
            'packages/gen/tests/integration/conformance/matrix.ts') }}
          restore-keys: ${{ runner.os }}-python-
      - run: mkdir -p ~/.cache/honey-tmp/python/sdk && touch "$RUNNER_TEMP/python-sdk-start"
      - run: bun install --frozen-lockfile
      - name: gen (python)
        working-directory: packages/gen
        run: >-
          bunx vitest run --project python --coverage --coverage.thresholds.lines=0
          --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0
          --reporter=default --reporter=blob --outputFile.blob="$RUNNER_TEMP/gen-blob/python.json"
        env:
          HONEY_REQUIRE_TOOLCHAINS: "1"
      - name: Prune the Python SDKs this run did not use
        run: >-
          find ~/.cache/honey-tmp/python/sdk -mindepth 2 -maxdepth 2 -name .complete
          ! -newer "$RUNNER_TEMP/python-sdk-start" -printf '%h\0' | xargs -0r rm -rf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gen-blob-python
          path: ${{ runner.temp }}/gen-blob/python.json
          if-no-files-found: error
          retention-days: 1

  # gen's csharp project: its files reach .NET alone (vitest.config.ts). This job owns the dotnet cache.
  gen-csharp:
    name: gen (csharp)
    needs: node-current
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # vitest runs on node
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ needs.node-current.outputs.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # the gated SDKs, the driver and the one build-time package (Microsoft.NET.ILLink.Tasks), keyed like the
      # python and rust caches on every input of a .NET gate (toolchain-projects.test.ts holds it to that); the
      # SDK itself is not cached: the install below fetches the pinned tarball and checks its sha512. This job
      # saves it; gen-rust only restores it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/honey-tmp/dotnet/nuget
            ~/.cache/honey-tmp/dotnet/sdk
            ~/.cache/honey-tmp/dotnet/driver
          key: >-
            ${{ runner.os }}-dotnet-${{ hashFiles('global.json', 'packages/gen/src/emit/csharp/**',
            'packages/gen/src/emit/csharp/**/.editorconfig', 'packages/gen/src/emit/shared/**', 'packages/gen/src/ir/**', 'packages/gen/src/runtime/csharp/**',
            'packages/gen/tests/security/**', 'packages/gen/tests/structure/mutation-harness*.ts',
            'packages/gen/tests/structure/csharp-toolchain.test.ts', 'packages/gen/tests/structure/compile-calls.ts',
            'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/features-mcp.ts', 'packages/gen/tests/integration/conformance/features-sdk.ts',
            'packages/gen/tests/integration/conformance/cells.ts',
            'packages/gen/tests/integration/conformance/matrix.ts') }}
          restore-keys: ${{ runner.os }}-dotnet-
      # gen runs every dotnet through its csharp-env fixture: the global.json SDK from its tarball, checked
      # against dotnet-sdk.sha512 before extraction, under ~/.cache/honey-tmp/dotnet, then the seed restore, the
      # one NuGet fetch (none when the cache above holds its package): the command a missing SDK names locally
      - name: .NET (global.json's SDK, and the seed restore)
        run: |
          V="$(sed -n 's/.*"version": "\(.*\)",/\1/p' global.json)" && D="$HOME/.cache/honey-tmp/dotnet" && F="$(git rev-parse --show-toplevel)/packages/gen/src/emit/csharp/__fixtures__" && T="$D/toolchain/$V" && mkdir -p "$D/dl" "$D/home" "$D/tmp" && curl -fsSL -o "$D/dl/dotnet-sdk-$V-linux-x64.tar.gz" "https://builds.dotnet.microsoft.com/dotnet/Sdk/$V/dotnet-sdk-$V-linux-x64.tar.gz" && (cd "$D/dl" && sha512sum -c "$F/dotnet-sdk.sha512") && rm -rf "$T" "$T.partial" && mkdir -p "$T.partial" && tar -xzf "$D/dl/dotnet-sdk-$V-linux-x64.tar.gz" -C "$T.partial" && mv "$T.partial" "$T" && rm "$D/dl/dotnet-sdk-$V-linux-x64.tar.gz" && DOTNET_CLI_HOME="$D/home" DOTNET_ROOT="$D/toolchain/$V" NUGET_HTTP_CACHE_PATH="$D/nuget-http" NUGET_PACKAGES="$D/nuget" NUGET_PLUGINS_CACHE_PATH="$D/nuget-plugins" TMPDIR="$D/tmp" HOME="$D/home" DOTNET_ADD_GLOBAL_TOOLS_TO_PATH="false" DOTNET_CLI_TELEMETRY_OPTOUT="1" DOTNET_CLI_UI_LANGUAGE="en" DOTNET_CLI_USE_MSBUILD_SERVER="0" DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE="1" DOTNET_GENERATE_ASPNET_CERTIFICATE="false" DOTNET_NOLOGO="1" DOTNET_SKIP_FIRST_TIME_EXPERIENCE="1" MSBUILDDISABLENODEREUSE="1" NUGET_XMLDOC_MODE="skip" UseSharedCompilation="false" "$T/dotnet" restore "$F/seed/Seed.csproj" --source https://api.nuget.org/v3/index.json --artifacts-path "$D/tmp/seed"
      - run: mkdir -p ~/.cache/honey-tmp/dotnet/sdk && touch "$RUNNER_TEMP/csharp-sdk-start"
      - run: bun install --frozen-lockfile
      - name: gen (csharp)
        working-directory: packages/gen
        run: >-
          bunx vitest run --project csharp --coverage --coverage.thresholds.lines=0
          --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0
          --reporter=default --reporter=blob --outputFile.blob="$RUNNER_TEMP/gen-blob/csharp.json"
        env:
          HONEY_REQUIRE_TOOLCHAINS: "1"
      - name: Prune the C# SDKs this run did not use
        run: >-
          find ~/.cache/honey-tmp/dotnet/sdk -mindepth 2 -maxdepth 2 -name .complete
          ! -newer "$RUNNER_TEMP/csharp-sdk-start" -printf '%h\0' | xargs -0r rm -rf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gen-blob-csharp
          path: ${{ runner.temp }}/gen-blob/csharp.json
          if-no-files-found: error
          retention-days: 1

  gen-java:
    name: gen (java)
    needs: node-current
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # vitest runs on node
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ needs.node-current.outputs.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # the compiled SDKs and Gradle's home, keyed like the other compile caches on every input of a Java gate
      # (toolchain-projects.test.ts holds it to that); the toolchain itself is not cached: the install below fetches
      # each pin and checks its sha256. This job saves it; gen-rust and the harness only restore it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/honey-tmp/java/sdk
            ~/.cache/honey-tmp/java/gradle-home
          key: >-
            ${{ runner.os }}-java-${{ hashFiles('packages/gen/src/emit/java/**', 'packages/gen/src/emit/shared/**',
            'packages/gen/src/ir/**', 'packages/gen/src/runtime/java/**', 'packages/gen/tests/security/**',
            'packages/gen/tests/structure/mutation-harness*.ts', 'packages/gen/tests/structure/java-toolchain.test.ts',
            'packages/gen/tests/structure/compile-calls.ts', 'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/features-mcp.ts', 'packages/gen/tests/integration/conformance/features-sdk.ts',
            'packages/gen/tests/integration/conformance/cells.ts',
            'packages/gen/tests/integration/conformance/matrix.ts') }}
          restore-keys: ${{ runner.os }}-java-
      # gen runs every java, javac, google-java-format and Gradle through its java-env fixture: each pin in
      # java-pins.json (three JDKs, the formatter, Gradle, the Jackson set) fetched and checked against its sha256,
      # under ~/.cache/honey-tmp/java: the command a missing JDK names locally
      - name: Java (java-pins.json's JDKs, google-java-format, Gradle and the Jackson set)
        run: |
          P="$(git rev-parse --show-toplevel)/packages/gen/src/emit/java/__fixtures__/java-pins.json" && D="$HOME/.cache/honey-tmp/java" && G="$(jq -r .googleJavaFormat.version "$P")" && W="$(jq -r .gradle.version "$P")" && mkdir -p "$D/dl" "$D/toolchain" "$D/repo" "$D/tmp" && for k in $(jq -r '.jdk | keys[]' "$P"); do R="$(jq -r --arg k "$k" '.jdk[$k].release' "$P")" && curl -fsSL -o "$D/dl/$R.tar.gz" "$(jq -r --arg k "$k" '.jdk[$k].url' "$P")" && echo "$(jq -r --arg k "$k" '.jdk[$k].sha256' "$P")  "$D/dl/$R.tar.gz"" | sha256sum -c - && rm -rf "$D/toolchain/$R" "$D/toolchain/$R.partial" && mkdir -p "$D/toolchain/$R.partial" && tar -xzf "$D/dl/$R.tar.gz" -C "$D/toolchain/$R.partial" --strip-components=1 && mv "$D/toolchain/$R.partial" "$D/toolchain/$R" && rm "$D/dl/$R.tar.gz" || exit 1; done && curl -fsSL -o "$D/toolchain/google-java-format-$G.jar" "$(jq -r --arg k "$k" '.googleJavaFormat.url' "$P")" && echo "$(jq -r --arg k "$k" '.googleJavaFormat.sha256' "$P")  "$D/toolchain/google-java-format-$G.jar"" | sha256sum -c - && curl -fsSL -o "$D/dl/gradle.zip" "$(jq -r --arg k "$k" '.gradle.url' "$P")" && echo "$(jq -r --arg k "$k" '.gradle.sha256' "$P")  "$D/dl/gradle.zip"" | sha256sum -c - && rm -rf "$D/toolchain/gradle-$W" && unzip -q "$D/dl/gradle.zip" -d "$D/toolchain" && rm "$D/dl/gradle.zip" && for a in $(jq -r '.jackson.artifacts[].path' "$P"); do mkdir -p "$D/repo/$(dirname "$a")" && curl -fsSL -o "$D/repo/$a" "$(jq -r .jackson.repository "$P")/$a" && echo "$(jq -r --arg a "$a" '.jackson.artifacts[] | select(.path == $a) | .sha256' "$P")  $D/repo/$a" | sha256sum -c - || exit 1; done
      - run: mkdir -p ~/.cache/honey-tmp/java/sdk && touch "$RUNNER_TEMP/java-sdk-start"
      - run: bun install --frozen-lockfile
      - name: gen (java)
        working-directory: packages/gen
        run: >-
          bunx vitest run --project java --coverage --coverage.thresholds.lines=0
          --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0
          --reporter=default --reporter=blob --outputFile.blob="$RUNNER_TEMP/gen-blob/java.json"
        env:
          HONEY_REQUIRE_TOOLCHAINS: "1"
      - name: Prune the Java SDKs this run did not use
        run: >-
          find ~/.cache/honey-tmp/java/sdk -mindepth 1 -maxdepth 1 -type d
          ! -newer "$RUNNER_TEMP/java-sdk-start" -print0 | xargs -0r rm -rf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gen-blob-java
          path: ${{ runner.temp }}/gen-blob/java.json
          if-no-files-found: error
          retention-days: 1

  # gen's coverage: the five shards' blobs merged, held to the per-file 100% thresholds in vitest.config.ts
  gen-coverage:
    name: gen coverage
    needs: [node-current, test, gen-rust, gen-python, gen-csharp, gen-java]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ needs.node-current.outputs.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gen-blob-*
          path: ${{ runner.temp }}/gen-blob
          merge-multiple: true
      - working-directory: packages/gen
        run: bunx vitest run --merge-reports "$RUNNER_TEMP/gen-blob" --coverage

  runtimes:
    name: runtime integration
    needs: node-current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Node 22.12 has no shouldUpgradeCallback, so it exercises the adapter's 'upgrade' fallback
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
      - run: echo "HONEY_TEST_NODE_LEGACY=$(which node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ needs.node-current.outputs.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # v1's adapters over raw sockets: Node current in-process, Bun spawned, and Node 22.12 spawned (its 'upgrade' fallback)
      - working-directory: packages/core
        run: HONEY_REQUIRE_NODE_LEGACY=1 bunx vitest run tests/integration/ws-adapters.test.ts

  hotpath:
    name: hot-path benchmark
    runs-on: ubuntu-latest
    # bit 21 k-pass: 3 interleaved passes and a 2.6 s round floor. At the slow runner class (3.9x local) the five
    # steps take ~666 s and the rest ~22 s, 688 s x 1.5 = 17.2 min; the 30-run history's worst steps scaled the same
    # way give 437 s x 1.5 = 10.9 min. The larger, rounded up.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # the runner's CPU model, to tell a per-runner bench level (a ratio cancels speed, not microarchitecture) from a
      # per-process one (bit 21: adapter's levels move together per job, and a job is one runner and one process)
      - name: cpu
        run: grep -m1 "model name" /proc/cpuinfo
      # Each bench: v1's cost as a ratio to a raw twin doing the same work, judged against its ceiling in
      # blueprint/baselines/bench.json (the worst of six CI runs on these pins, plus 10%): that margin is the
      # noise budget, so a red is never retried away. A red with v1 unchanged is answered by a re-record
      # (dispatch this workflow with bench_mode=record, the ceiling widened with its evidence), never a rerun.
      - name: hotpath
        run: bun run bench:hotpath
        env:
          BENCH_MODE: ${{ inputs.bench_mode || 'judge' }}
      - name: finalize
        run: bun run bench:finalize
        env:
          BENCH_MODE: ${{ inputs.bench_mode || 'judge' }}
      - name: streaming
        run: bun run bench:streaming
        env:
          BENCH_MODE: ${{ inputs.bench_mode || 'judge' }}
      - name: websockets
        run: bun run bench:websockets
        env:
          BENCH_MODE: ${{ inputs.bench_mode || 'judge' }}
      # the Node bridge on Node itself (node:http under Bun is Bun's own), on the version adapter's
      # ceilings were recorded with
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.12.1"
      - name: adapter
        run: bun run bench:adapter
        env:
          BENCH_MODE: ${{ inputs.bench_mode || 'judge' }}

  build:
    name: build (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    # bit 21 bref: each cell times its own 4 references (15,000 units of JS work, ~1.3-1.8 s each). The worst build
    # job of the last 5 CI runs took 5.9 min with its run-build span at most 5.4; that span projects to 10.1 min
    # (CI's own reference ms x the new/old reference ratio measured locally), so ~10.6 min x 1.5 = 15.9, rounded up.
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # the node tier runs the built bundles on the oldest supported Node line, not the image default
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run generate
      # the runner's CPU model, so the build ratios' runner classes can be told by CPU as well as by surface ms (H1)
      - name: cpu
        run: grep -m1 "model name" /proc/cpuinfo
      # --check-generated: the checkout is clean here, so a build that rewrites a
      # committed generated file means it is stale or codegen is not deterministic.
      # each cell's time over a honey-free reference build's, judged against blueprint/baselines/build.json; a
      # dispatch with build_mode=record prints the RATIO lines its ceilings are derived from (build-gate.ts)
      - run: bun packages/core/tests/e2e/run-build.ts --runtime ${{ matrix.runtime }} --check-generated
        env:
          BUILD_MODE: ${{ inputs.build_mode || 'judge' }}

  packaging:
    name: packaging (node ${{ matrix.node }})
    needs: node-current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # the oldest supported LTS and the current release: Node behavior differs across versions
        node: ["22", "current"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ (matrix.node || 'current') == 'current' && needs.node-current.outputs.node || matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # packs the real tarball, type-checks a consumer with every strictness flag on, then runs
      # it on Bun and on plain Node: the core entry, honey generate, and vite build with the
      # honey plugins. Every other tier runs honey from source, so nothing else can see this.
      - run: bun run test:packaging

  e2e:
    name: e2e (${{ matrix.runtime }}${{ matrix.node && format(' {0}', matrix.node) || '' }}${{ matrix.prod && ' prod' || '' }})
    needs: node-current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node
            node: "22"
            script: test:e2e:node
          - runtime: node
            node: "current"
            script: test:e2e:node
          - runtime: cf-workers
            script: test:e2e:cf
          # prod (Q14): run.ts builds each app for the runtime, then Playwright drives the built bundle, no source
          - runtime: node
            node: "22"
            prod: true
            script: test:e2e:node:prod
          - runtime: node
            node: "current"
            prod: true
            script: test:e2e:node:prod
          - runtime: bun
            prod: true
            script: test:e2e:bun:prod
          # cf: wrangler dev serves the built worker under local workerd, no deploy and no secrets
          - runtime: cf-workers
            prod: true
            script: test:e2e:cf:prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # cf-workers still runs node for wrangler, playwright and the type-stripped fixtures
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ (matrix.node || 'current') == 'current' && needs.node-current.outputs.node || matrix.node }}
      - run: bun install --frozen-lockfile
      # the MCP app's cells drive the mounted endpoint with the pinned official clients (bit 21 e): as in the test job
      - name: MCP clients (client-lock.json's @modelcontextprotocol/sdk and @modelcontextprotocol/client)
        run: P="$(git rev-parse --show-toplevel)/packages/gen/src/emit/mcp/__fixtures__" && D="$HOME/.cache/honey-tmp/mcp-clients" && rm -rf "$D.partial" && mkdir -p "$D.partial" && cp "$P/client-pins.json" "$D.partial/package.json" && cp "$P/client-lock.json" "$D.partial/package-lock.json" && (cd "$D.partial" && npm ci --ignore-scripts --no-audit --no-fund) && sha256sum "$P/client-lock.json" | cut -d" " -f1 > "$D.partial/lock.sha256" && rm -rf "$D" && mv "$D.partial" "$D"
      - run: bun run generate
      # a prod cell builds its app through run-build.ts first, under the same build gate as the build job
      - run: bun run ${{ matrix.script }}
        env:
          BUILD_MODE: ${{ inputs.build_mode || 'judge' }}
          HONEY_REQUIRE_TOOLCHAINS: "1"

  harness:
    name: harness
    needs: node-current
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # vitest and the emitted SDK's WebSocket run on node: the global WebSocket needs Node >= 22
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ needs.node-current.outputs.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # the MCP server's conformance runner requires the pinned clients here (HONEY_REQUIRE_TOOLCHAINS): as in the test job
      - name: MCP clients (client-lock.json's @modelcontextprotocol/sdk and @modelcontextprotocol/client)
        run: P="$(git rev-parse --show-toplevel)/packages/gen/src/emit/mcp/__fixtures__" && D="$HOME/.cache/honey-tmp/mcp-clients" && rm -rf "$D.partial" && mkdir -p "$D.partial" && cp "$P/client-pins.json" "$D.partial/package.json" && cp "$P/client-lock.json" "$D.partial/package-lock.json" && (cd "$D.partial" && npm ci --ignore-scripts --no-audit --no-fund) && sha256sum "$P/client-lock.json" | cut -d" " -f1 > "$D.partial/lock.sha256" && rm -rf "$D" && mv "$D.partial" "$D"
      # the pinned Go, the same as the test job and every local run; emitted go.mod files keep the go
      # 1.24 floor (`omitzero` on tri-state fields), which go vet enforces
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: .go-version
          cache: false
      # the pinned and floor toolchains and the WebSocket module: a change in any saves a new cache
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/honey-tmp/go/mod
          key: ${{ runner.os }}-gomod-harness-${{ hashFiles('.go-version', 'packages/gen/src/emit/go/__fixtures__/go-env.ts', 'packages/gen/src/emit/go/sdk.ts') }}
          restore-keys: ${{ runner.os }}-gomod-harness-
      # gen runs every Python command through its python-env fixture, with the uv uv.toml pins and the interpreters
      # .python-version and PY_FLOOR name, all under ~/.cache/honey-tmp/python and linked nowhere (--no-bin).
      # setup-uv provides a uv at that pin (required-version fails any other), which installs the pinned uv into the
      # cache, which installs the interpreters: the commands a missing one names locally. None is cached: each
      # installs in about a second.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.toml
          enable-cache: false
      - name: Python (uv.toml's uv, .python-version, and the PY_FLOOR interpreter)
        run: |
          UV_CACHE_DIR="$HOME/.cache/honey-tmp/python/uv-cache" UV_TOOL_DIR="$HOME/.cache/honey-tmp/python/uv/tools" UV_TOOL_BIN_DIR="$HOME/.cache/honey-tmp/python/uv/bin" uv tool install --no-config --no-python-downloads uv=="$(sed -n 's/^required-version = "==\(.*\)"$/\1/p' uv.toml)"
          UV_CACHE_DIR="$HOME/.cache/honey-tmp/python/uv-cache" UV_PYTHON_INSTALL_DIR="$HOME/.cache/honey-tmp/python/pythons" UV_PYTHON_BIN_DIR="$HOME/.cache/honey-tmp/python/pybin" "$HOME/.cache/honey-tmp/python/uv/bin/uv" python install --no-bin "$(cat .python-version)" 3.11.4
      # gen compiles the emitted Rust at the toolchain rust-toolchain.toml pins (RUSTUP_TOOLCHAIN through its
      # rust-env fixture) and checks it at the RUST_FLOOR toolchain. A bare install reads the file; the default
      # follows it, so any other cargo in the job runs the pin too. Toolchains are not cached: a minimal one
      # installs in seconds.
      - name: Rust (rust-toolchain.toml, and the RUST_FLOOR toolchain)
        run: |
          rustup toolchain install
          rustup default "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install 1.85.0 --profile minimal --component clippy
      # gen runs every dotnet through its csharp-env fixture, installed as in gen-csharp (which says why)
      - name: .NET (global.json's SDK, and the seed restore)
        run: |
          V="$(sed -n 's/.*"version": "\(.*\)",/\1/p' global.json)" && D="$HOME/.cache/honey-tmp/dotnet" && F="$(git rev-parse --show-toplevel)/packages/gen/src/emit/csharp/__fixtures__" && T="$D/toolchain/$V" && mkdir -p "$D/dl" "$D/home" "$D/tmp" && curl -fsSL -o "$D/dl/dotnet-sdk-$V-linux-x64.tar.gz" "https://builds.dotnet.microsoft.com/dotnet/Sdk/$V/dotnet-sdk-$V-linux-x64.tar.gz" && (cd "$D/dl" && sha512sum -c "$F/dotnet-sdk.sha512") && rm -rf "$T" "$T.partial" && mkdir -p "$T.partial" && tar -xzf "$D/dl/dotnet-sdk-$V-linux-x64.tar.gz" -C "$T.partial" && mv "$T.partial" "$T" && rm "$D/dl/dotnet-sdk-$V-linux-x64.tar.gz" && DOTNET_CLI_HOME="$D/home" DOTNET_ROOT="$D/toolchain/$V" NUGET_HTTP_CACHE_PATH="$D/nuget-http" NUGET_PACKAGES="$D/nuget" NUGET_PLUGINS_CACHE_PATH="$D/nuget-plugins" TMPDIR="$D/tmp" HOME="$D/home" DOTNET_ADD_GLOBAL_TOOLS_TO_PATH="false" DOTNET_CLI_TELEMETRY_OPTOUT="1" DOTNET_CLI_UI_LANGUAGE="en" DOTNET_CLI_USE_MSBUILD_SERVER="0" DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE="1" DOTNET_GENERATE_ASPNET_CERTIFICATE="false" DOTNET_NOLOGO="1" DOTNET_SKIP_FIRST_TIME_EXPERIENCE="1" MSBUILDDISABLENODEREUSE="1" NUGET_XMLDOC_MODE="skip" UseSharedCompilation="false" "$T/dotnet" restore "$F/seed/Seed.csproj" --source https://api.nuget.org/v3/index.json --artifacts-path "$D/tmp/seed"
      # restored, never saved: gen-csharp owns it; the served SDK builds here each run
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/honey-tmp/dotnet/nuget
            ~/.cache/honey-tmp/dotnet/sdk
            ~/.cache/honey-tmp/dotnet/driver
          key: >-
            ${{ runner.os }}-dotnet-${{ hashFiles('global.json', 'packages/gen/src/emit/csharp/**',
            'packages/gen/src/emit/csharp/**/.editorconfig', 'packages/gen/src/emit/shared/**', 'packages/gen/src/ir/**', 'packages/gen/src/runtime/csharp/**',
            'packages/gen/tests/security/**', 'packages/gen/tests/structure/mutation-harness*.ts',
            'packages/gen/tests/structure/csharp-toolchain.test.ts', 'packages/gen/tests/structure/compile-calls.ts',
            'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/features-mcp.ts', 'packages/gen/tests/integration/conformance/features-sdk.ts',
            'packages/gen/tests/integration/conformance/cells.ts',
            'packages/gen/tests/integration/conformance/matrix.ts') }}
          restore-keys: ${{ runner.os }}-dotnet-
      # gen runs every java, javac, google-java-format and Gradle through its java-env fixture: each pin in
      # java-pins.json (three JDKs, the formatter, Gradle, the Jackson set) fetched and checked against its sha256,
      # under ~/.cache/honey-tmp/java: the command a missing JDK names locally
      - name: Java (java-pins.json's JDKs, google-java-format, Gradle and the Jackson set)
        run: |
          P="$(git rev-parse --show-toplevel)/packages/gen/src/emit/java/__fixtures__/java-pins.json" && D="$HOME/.cache/honey-tmp/java" && G="$(jq -r .googleJavaFormat.version "$P")" && W="$(jq -r .gradle.version "$P")" && mkdir -p "$D/dl" "$D/toolchain" "$D/repo" "$D/tmp" && for k in $(jq -r '.jdk | keys[]' "$P"); do R="$(jq -r --arg k "$k" '.jdk[$k].release' "$P")" && curl -fsSL -o "$D/dl/$R.tar.gz" "$(jq -r --arg k "$k" '.jdk[$k].url' "$P")" && echo "$(jq -r --arg k "$k" '.jdk[$k].sha256' "$P")  "$D/dl/$R.tar.gz"" | sha256sum -c - && rm -rf "$D/toolchain/$R" "$D/toolchain/$R.partial" && mkdir -p "$D/toolchain/$R.partial" && tar -xzf "$D/dl/$R.tar.gz" -C "$D/toolchain/$R.partial" --strip-components=1 && mv "$D/toolchain/$R.partial" "$D/toolchain/$R" && rm "$D/dl/$R.tar.gz" || exit 1; done && curl -fsSL -o "$D/toolchain/google-java-format-$G.jar" "$(jq -r --arg k "$k" '.googleJavaFormat.url' "$P")" && echo "$(jq -r --arg k "$k" '.googleJavaFormat.sha256' "$P")  "$D/toolchain/google-java-format-$G.jar"" | sha256sum -c - && curl -fsSL -o "$D/dl/gradle.zip" "$(jq -r --arg k "$k" '.gradle.url' "$P")" && echo "$(jq -r --arg k "$k" '.gradle.sha256' "$P")  "$D/dl/gradle.zip"" | sha256sum -c - && rm -rf "$D/toolchain/gradle-$W" && unzip -q "$D/dl/gradle.zip" -d "$D/toolchain" && rm "$D/dl/gradle.zip" && for a in $(jq -r '.jackson.artifacts[].path' "$P"); do mkdir -p "$D/repo/$(dirname "$a")" && curl -fsSL -o "$D/repo/$a" "$(jq -r .jackson.repository "$P")/$a" && echo "$(jq -r --arg a "$a" '.jackson.artifacts[] | select(.path == $a) | .sha256' "$P")  $D/repo/$a" | sha256sum -c - || exit 1; done
      # restored, never saved: gen-java owns it
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/honey-tmp/java/sdk
            ~/.cache/honey-tmp/java/gradle-home
          key: >-
            ${{ runner.os }}-java-${{ hashFiles('packages/gen/src/emit/java/**', 'packages/gen/src/emit/shared/**',
            'packages/gen/src/ir/**', 'packages/gen/src/runtime/java/**', 'packages/gen/tests/security/**',
            'packages/gen/tests/structure/mutation-harness*.ts', 'packages/gen/tests/structure/java-toolchain.test.ts',
            'packages/gen/tests/structure/compile-calls.ts', 'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/features-mcp.ts', 'packages/gen/tests/integration/conformance/features-sdk.ts',
            'packages/gen/tests/integration/conformance/cells.ts',
            'packages/gen/tests/integration/conformance/matrix.ts') }}
          restore-keys: ${{ runner.os }}-java-
      # gen's Rust caches for the toolchain files run below, keyed as in the test job
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/honey-tmp/rust/cargo
            ~/.cache/honey-tmp/rust/target
            ~/.cache/honey-tmp/rust/target-1.85.0
            ~/.cache/honey-tmp/rust/sdk
          key: >-
            ${{ runner.os }}-rust-harness-${{ hashFiles('rust-toolchain.toml', 'packages/gen/src/emit/rust/**',
            'packages/gen/src/emit/shared/**', 'packages/gen/src/ir/**', 'packages/gen/src/runtime/rust/**',
            'packages/gen/tests/security/**', 'packages/gen/tests/structure/mutation-harness*.ts',
            'packages/gen/tests/structure/rust-toolchain.test.ts', 'packages/gen/tests/structure/compile-calls.ts',
            'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/features-mcp.ts', 'packages/gen/tests/integration/conformance/features-sdk.ts',
            'packages/gen/tests/integration/conformance/cells.ts',
            'packages/gen/tests/integration/conformance/matrix.ts',
            'packages/core/tests/integration/conformance/**') }}
          restore-keys: ${{ runner.os }}-rust-harness-
      # the gated SDKs and their mypy caches (python/__fixtures__/compiled.ts), keyed like gobuild and rust on every
      # input of a Python gate (toolchain-projects.test.ts holds it to that). uv's wheel cache is not saved: a venv
      # fetches its wheels once per run, then installs offline, and the markers that vouch for them go with it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/honey-tmp/python/mypy
            ~/.cache/honey-tmp/python/sdk
          key: >-
            ${{ runner.os }}-python-harness-${{ hashFiles('.python-version', 'uv.toml', 'packages/gen/src/emit/python/**',
            'packages/gen/src/emit/shared/**', 'packages/gen/src/ir/**', 'packages/gen/src/runtime/python/**',
            'packages/gen/tests/security/**', 'packages/gen/tests/structure/mutation-harness*.ts',
            'packages/gen/tests/structure/python-toolchain.test.ts', 'packages/gen/tests/structure/compile-calls.ts',
            'packages/gen/src/emit/mcp/python-client.test.ts', 'packages/gen/src/emit/mcp/__fixtures__/python-client.ts',
            'packages/gen/src/emit/mcp/python-oauth.test.ts',
            'packages/gen/src/emit/mcp/__fixtures__/client-constraints.txt',
            'packages/gen/tests/integration/conformance/features.ts',
            'packages/gen/tests/integration/conformance/features-mcp.ts', 'packages/gen/tests/integration/conformance/features-sdk.ts',
            'packages/gen/tests/integration/conformance/cells.ts',
            'packages/gen/tests/integration/conformance/matrix.ts',
            'packages/core/tests/integration/conformance/**') }}
          restore-keys: ${{ runner.os }}-python-harness-
      - run: bun install --frozen-lockfile
      # the release leg (cli-harness.release.test.ts) checks with goreleaser and shellcheck: the test job's tool install
      - name: Tools (tool-pins.json's fish, zsh, PowerShell, goreleaser and shellcheck)
        run: P="$(git rev-parse --show-toplevel)/packages/gen/src/emit/cli/__fixtures__/tool-pins.json" && D="$HOME/.cache/honey-tmp/tools" && mkdir -p "$D/dl" && for k in $(jq -r 'keys[]' "$P"); do U="$(jq -r --arg k "$k" '.[$k].url' "$P")" && R="$(jq -r --arg k "$k" '.[$k].dir' "$P")" && curl -fsSL -o "$D/dl/$k" "$U" && echo "$(jq -r --arg k "$k" '.[$k].sha256' "$P")  $D/dl/$k" | sha256sum -c - && rm -rf "$D/$R" "$D/$R.partial" && mkdir -p "$D/$R.partial" && tar -xf "$D/dl/$k" -C "$D/$R.partial" && chmod +x "$D/$R.partial/$(jq -r --arg k "$k" '.[$k].bin' "$P")" && mv "$D/$R.partial" "$D/$R" && rm "$D/dl/$k" || exit 1; done
      - run: mkdir -p ~/.cache/honey-tmp/rust/sdk && touch "$RUNNER_TEMP/rust-sdk-start"
      - run: mkdir -p ~/.cache/honey-tmp/python/sdk && touch "$RUNNER_TEMP/python-sdk-start"
      - run: bun run test:harness
        env:
          # a Python problem fails the job instead of skipping the Python SDK tests
          HONEY_REQUIRE_PYTHON: "1"
          # a missing Go, Rust, Python or .NET fails gen's conformance and harness files for it instead of skipping them
          HONEY_REQUIRE_TOOLCHAINS: "1"
          # each conformance cell's observation, for the conformance job's gate
          HONEY_CONFORMANCE_RECORD: ${{ runner.temp }}/conformance-cells
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-cells
          path: ${{ runner.temp }}/conformance-cells
          if-no-files-found: error
          retention-days: 7
      # as in the test job: the saved cache keeps only the Rust SDKs this run built or reused
      - name: Prune the Rust SDKs this run did not use
        run: >-
          find ~/.cache/honey-tmp/rust/sdk -mindepth 2 -maxdepth 2 -name .complete
          ! -newer "$RUNNER_TEMP/rust-sdk-start" -printf '%h\0' | xargs -0r rm -rf
      - name: Prune the Python SDKs this run did not use
        run: >-
          find ~/.cache/honey-tmp/python/sdk -mindepth 2 -maxdepth 2 -name .complete
          ! -newer "$RUNNER_TEMP/python-sdk-start" -printf '%h\0' | xargs -0r rm -rf

  # the release's conformance gate (bit 19): every cell of every target held by the harness's record (compareCell),
  # or lacked by design; a regressed or unrun cell fails it, and release.yml publishes only on this workflow green
  conformance:
    name: conformance gate
    needs: harness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-cells
          path: ${{ runner.temp }}/conformance-cells
      - env:
          CELLS: ${{ runner.temp }}/conformance-cells
        run: bun packages/gen/tests/integration/conformance/gate.ts "$CELLS"
