openapi: "3.1.0"
info:
  title: Honey Defaults
  version: "0.0.1"
paths:
  /echo:
    post:
      x-honey-route: POST /echo
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEchoResponse201"
  /health:
    get:
      x-honey-route: GET /health
      responses:
        "200":
          description: Success
  /users/{id}:
    get:
      x-honey-route: "GET /users/:id"
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
components:
  schemas:
    CreateEchoResponse201:
      type: string
