name: Release

# A v* tag publishes the two packages that ship, @lovrozagar/honey and @lovrozagar/honey-codegen, to npm with
# provenance, once ci.yml (its harness and conformance gate included) passes on the tagged commit. A failed release
# re-runs on its tag: `gh workflow run release.yml --ref vX.Y.Z`; a version already on npm is skipped.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"

jobs:
  # each manifest checked against the tag, then packed by its prepack: no write, no token
  pack:
    name: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Check @lovrozagar/honey against the tag
        working-directory: packages/core
        env:
          PACKAGE: "@lovrozagar/honey"
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then echo "the release runs on a v* tag, not $GITHUB_REF_NAME"; exit 1; fi
          got="$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')"
          if [ "$got" != "$PACKAGE@${GITHUB_REF_NAME#v}" ]; then echo "$got is not the tag's $PACKAGE@${GITHUB_REF_NAME#v}"; exit 1; fi
      - name: Check @lovrozagar/honey-codegen against the tag
        working-directory: packages/gen
        env:
          PACKAGE: "@lovrozagar/honey-codegen"
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then echo "the release runs on a v* tag, not $GITHUB_REF_NAME"; exit 1; fi
          got="$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')"
          if [ "$got" != "$PACKAGE@${GITHUB_REF_NAME#v}" ]; then echo "$got is not the tag's $PACKAGE@${GITHUB_REF_NAME#v}"; exit 1; fi
      # the tag's notes: a version nobody wrote an entry for never reaches npm
      - name: Check the CHANGELOG entry for the tag
        run: bun "$GITHUB_WORKSPACE/scripts/changelog.ts" "${GITHUB_REF_NAME#v}"
      - run: bun install --frozen-lockfile
      # scripts/pack.ts, as the packaging tests pack: catalog: and workspace: resolved to versions, then npm pack
      - name: Pack @lovrozagar/honey
        working-directory: packages/core
        run: bun ../../scripts/pack.ts "$RUNNER_TEMP/tarballs" .
      - name: Pack @lovrozagar/honey-codegen
        working-directory: packages/gen
        run: bun ../../scripts/pack.ts "$RUNNER_TEMP/tarballs" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
          if-no-files-found: error
          retention-days: 7

  # the whole of ci.yml on the tagged commit, with this workflow's read-only token: the CI evidence a publish needs
  ci:
    name: ci
    needs: pack
    uses: ./.github/workflows/ci.yml

  # the one job that mints an OIDC token: it runs no repository code, only npm on the packed tarballs
  npm:
    name: npm
    needs: [pack, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      # trusted publishing (the OIDC exchange, no stored token) needs npm 11.5.1 or later
      - run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
      - name: Publish @lovrozagar/honey
        env:
          PACKAGE: "@lovrozagar/honey"
          TARBALL: lovrozagar-honey
        run: |
          v="${GITHUB_REF_NAME#v}"
          if npm view "$PACKAGE@$v" version >/dev/null 2>&1; then echo "$PACKAGE@$v is already on npm"; exit 0; fi
          npm publish "$RUNNER_TEMP/tarballs/$TARBALL-$v.tgz" --provenance --access public
      - name: Publish @lovrozagar/honey-codegen
        env:
          PACKAGE: "@lovrozagar/honey-codegen"
          TARBALL: lovrozagar-honey-codegen
        run: |
          v="${GITHUB_REF_NAME#v}"
          if npm view "$PACKAGE@$v" version >/dev/null 2>&1; then echo "$PACKAGE@$v is already on npm"; exit 0; fi
          npm publish "$RUNNER_TEMP/tarballs/$TARBALL-$v.tgz" --provenance --access public

  # the one job that writes: the tag's GitHub release, once both packages are on npm
  github-release:
    name: GitHub release
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "the release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "${GITHUB_REF_NAME#v}"
          fi
